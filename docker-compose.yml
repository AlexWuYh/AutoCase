# AutoCase Platform - Docker Compose
# Usage:
#   cp .env.example .env  (then edit SECRET_KEY, INITIAL_ADMIN_PASSWORD, etc.)
#   docker compose up -d --build
#   open http://localhost:8080
#
# Notes:
# - Build context is the project root so the backend can install the CLI core from src/.
# - SQLite db and uploads are persisted via bind mounts in ./data and ./uploads.

services:
  redis:
    image: redis:7-alpine
    container_name: autocase-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: autocase-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside compose, "redis" is the service hostname
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: autocase-worker
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./data:/app/data
    command: ["celery", "-A", "app.celery_app", "worker", "-l", "info", "--concurrency=2"]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autocase-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  redis-data:
